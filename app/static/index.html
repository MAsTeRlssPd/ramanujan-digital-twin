<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramanujan - Digital Twin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Allura&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
    
    <!-- Graphing (function-plot, Plotly, Math.js) -->
    <script src="https://unpkg.com/d3@7"></script>
    <script src="https://unpkg.com/function-plot@1/dist/function-plot.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.0.0/math.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <button id="toggle-sidebar" class="icon-btn" title="Toggle Sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="header-title">
                <h1>Srinivasa Ramanujan</h1>
                <span class="subtitle">Digital Twin</span>
            </div>
            <div class="header-controls">
                <button id="voice-toggle" class="voice-toggle" title="Auto-read responses aloud">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <span>Voice</span>
                </button>
                <button id="toggle-memory" class="icon-btn" title="Toggle Memory">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Sidebar: Sessions -->
            <aside id="left-sidebar-panel" class="sidebar left-sidebar">
                <div class="sidebar-header">
                    <h2>Conversations</h2>
                    <button id="new-chat-btn" class="icon-btn small" title="New Chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>
                <div class="sidebar-content" id="sessions-content">
                    <!-- Sessions injected here -->
                </div>
                <div class="sidebar-header" style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <h2>Timeline</h2>
                </div>
                <div id="timeline-content" class="sidebar-content"></div>
            </aside>

            <!-- Center: Chat Interface -->
            <main class="chat-panel">
                <div id="chat-messages" class="messages-container">
                    <!-- Messages injected here -->
                    <div class="message system-message">
                        <div class="message-content">
                            Pray, what mathematical thoughts occupy your mind today?
                        </div>
                    </div>
                </div>
                <div class="image-preview-container" id="image-preview-container" style="display: none;">
                    <img id="image-preview" src="" alt="Image Preview">
                    <button id="remove-image-btn" class="icon-btn small" title="Remove Image">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                
                <div class="input-area">
                    <div id="suggestions-container" class="suggestions-container">
                    <button class="suggestion-btn" onclick="document.getElementById('message-input').value = this.innerText; document.getElementById('send-button').click();">Tell me about the goddess Namagiri.</button>
                    <button class="suggestion-btn" onclick="document.getElementById('message-input').value = this.innerText; document.getElementById('send-button').click();">How did you discover the partition formula?</button>
                    <button class="suggestion-btn" onclick="document.getElementById('message-input').value = this.innerText; document.getElementById('send-button').click();">What is the significance of 1729?</button>
                    <button class="suggestion-btn" onclick="document.getElementById('message-input').value = this.innerText; document.getElementById('send-button').click();">Can you plot a 3D mathematical surface?</button>
                </div>
                <div class="input-area-inner">
                    <input type="file" id="image-upload" accept="image/*" style="display: none;">
                    <button id="upload-btn" class="icon-btn" title="Upload Image">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>

                    <button id="mic-btn" class="icon-btn" title="Start Voice Input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    
                    <textarea id="message-input" placeholder="Ask Ramanujan a mathematical question..." rows="1"></textarea>
                    
                    <button id="send-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </main>

            <!-- Right Sidebar: Memory -->
            <aside id="memory-panel" class="sidebar right-sidebar">
                <div class="sidebar-header">
                    <h2>Memory & Context</h2>
                    <button id="refresh-memory" class="icon-btn small" title="Refresh">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>
                <div class="sidebar-content" id="memory-content">
                    <div id="memory-empty-state" class="empty-state">
                        Ramanujan has not yet formed memories of our conversation.
                    </div>
                    <!-- Memory categories injected here -->
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/timeline.js"></script>
    <script src="/static/memory.js"></script>
    <script src="/static/chat.js"></script>
</body>
</html>
