services:
  - type: web
    name: ramanujan-digital-twin
    runtime: python
    region: oregon   # Free tier region

    # --- Build ---
    buildCommand: pip install -r requirements.txt

    # --- Start ---
    startCommand: bash startup.sh

    # --- Environment Variables ---
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"

    # --- Persistent Disk ---
    # Stores ChromaDB vector index and SQLite memory database across deploys.
    disk:
      name: ramanujan-data
      mountPath: /data
      sizeGB: 1          # 1 GB — free tier

    # --- Health Check ---
    healthCheckPath: /
