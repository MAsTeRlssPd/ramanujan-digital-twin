services:
  - type: web
    name: ramanujan-digital-twin
    runtime: python
    region: oregon   # Free tier region

    # --- Build ---
    buildCommand: pip install -r requirements.txt

    # --- Start ---
    startCommand: bash startup.sh

    # --- Environment Variables ---
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"

    # --- Health Check ---
    healthCheckPath: /
